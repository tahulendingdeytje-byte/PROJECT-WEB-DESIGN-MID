<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
    <link rel="index" href="index.html">
</head>
<body>
    
    <header class="site-header">

        <div class="brand">Web Taman kelong</div>

        <nav class="site-nav">

            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="pesan.html">Pesan</a></li>

                <li><a href="tentang.html">Tentang</a></li>

                <li><a href="kontak.html">Kontak</a></li>

            </ul>

        </nav>

    </header>
      <section id="pesan">

        <h2>Pesan Kunjungan</h2>

        <form action="#" method="post">

            <fieldset>

                <legend>Data Pengunjung</legend>

                <label for="nama">Nama</label>

                <input type="text" id="nama" name="nama" required />

                <label for="email">Email</label>

                <input type="email" id="email" name="email" required />

                <label for="tgl">Tanggal Kunjungan</label>

                <input type="date" id="tgl" name="tgl" />

                <label for="jml">Jumlah Orang</label>

                <input type="number" id="jml" name="jml" min="1" max="20" />

                <label for="paket">Paket</label>

                <select id="paket" name="paket">

                    <option>makanan</option>

                    <option>sewa meja & sound system</option>

                    <option>paket lengkap</option>

                </select>

                <label for="catatan">Catatan</label>

                <textarea id="catatan" name="catatan" rows="3"></textarea>

                <button type="submit">Kirim Pesanan</button>

            </fieldset>

        </form>

    </section>
     <section id="tiket">

        <h2>Harga Tiket</h2>

        <table>

            <thead>

                <tr>

                    <th>Layanan</th>

                    <th>Keterangan</th>

                    <th>Tarif</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>paket lengkap</td>

                    <td>meja, sound system & makanan</td>

                    <td>Rp550.000</td>

                </tr>

                <tr>

                    <td>Sewa meja & sound system</td>

                    <td>Per set</td>

                    <td>Rp 300.000</td>

                </tr>

                <tr>

                    <td>makanan</td>

                    <td>Per paket</td>

                    <td>Rp25.000 - Rp250.000</td>

                </tr>

            </tbody>

        </table>

    </section>

</body>
</html>
